name: Build Windows (manual)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: release/*.exe
          retention-days: 7
